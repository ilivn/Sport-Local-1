<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sport local</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
:root{
  --bg:#F3F4EE; --surface:#FFFFFF; --ink:#12201A; --muted:#55625B; --line:#DDE0D6;
  --green:#0E4B38; --lime:#C8F03C; --warn:#9A3412;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#DADDD2;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1F6FEB;outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px}
a{color:var(--green);font-weight:600}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(18,32,26,.18)}
.tab{flex:1;min-height:0;overflow-y:auto;display:none;position:relative}
.tab.on{display:block}
.pad{padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px}
#tabbar{display:flex;height:68px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
#tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
#tabbar button.on{color:var(--green);font-weight:700}
#tabbar svg,.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{min-height:50px;padding:0 18px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.btn.lime{background:var(--lime);color:var(--ink);border:2px solid var(--ink)}
.btn.small{min-height:44px;padding:0 14px;border-radius:12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.card{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
button.card,a.card{border:0;text-align:left;text-decoration:none;color:var(--ink);font-weight:400;width:100%}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 12px;border:0;border-radius:16px;background:var(--surface);text-align:left}
.item .grow{flex:1;min-width:0}
.t{font-weight:700;overflow-wrap:anywhere}
.s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex-shrink:0;min-height:40px;padding:0 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--lime);border-color:var(--ink)}
.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600}
.tag.lime{background:var(--lime)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(18,32,26,.35)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar.big{width:72px;height:72px;font-family:var(--display);font-size:26px;background:var(--lime);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.field input,.field textarea,.field select{min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:400;font-size:15px}
.note{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:12px;background:#FFF3D6;color:#5B3A00;font-size:13px;font-weight:600}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;font-weight:700;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
/* carte */
#tab-map,#tab-routes{overflow:hidden}
#map,#map2{position:absolute;inset:0;z-index:0;background:#E7EADF}
.maptop{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.maptop>*{pointer-events:auto}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:14px;background:var(--surface);color:var(--muted);box-shadow:0 2px 10px rgba(18,32,26,.18);text-align:left}
.searchbtn .ico{color:var(--green);width:20px;height:20px}
.maptop .chip{box-shadow:0 1px 5px rgba(18,32,26,.16)}
.locate{position:absolute;z-index:500;right:12px;width:48px;height:48px;border:0;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(18,32,26,.22);display:flex;align-items:center;justify-content:center}
#sheet{position:absolute;z-index:600;left:0;right:0;bottom:0;max-height:52%;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(18,32,26,.14);display:flex;flex-direction:column}
#sheet.closed .sheetlist{display:none}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 16px;border:0;background:none;text-align:left}
.sheetlist{overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.sheetlist .item{border:1px solid var(--line)}
#routepanel{position:absolute;z-index:600;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(18,32,26,.14);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;max-height:60%;overflow-y:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats b{display:block;font-family:var(--display);font-size:22px}
.me-dot{width:20px;height:20px;border-radius:50%;background:#1F6FEB;border:3px solid #fff;box-shadow:0 0 0 8px rgba(31,111,235,.2)}
.leaflet-container{font-family:var(--body)}
.pin{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(18,32,26,.45)}
.cluster{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;border:3px solid var(--lime);box-shadow:0 2px 6px rgba(18,32,26,.35)}
.hours{white-space:pre-line}
/* pages empilées */
#page{position:absolute;inset:0;z-index:1000;background:var(--bg);display:none;flex-direction:column}
#page.on{display:flex}
.pagehead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.back{width:44px;height:44px;border:0;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pagebody{flex:1;min-height:0;overflow-y:auto}
.pagefoot{flex-shrink:0;padding:10px 16px 14px;background:var(--surface);border-top:1px solid var(--line)}
/* discussion */
.msgs{padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:86%;padding:11px 14px;border-radius:18px 18px 18px 4px;background:var(--surface);align-self:flex-start;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--green);color:#fff;border-radius:18px 18px 4px 18px}
.bubble .item{margin-top:8px;border:1px solid var(--line)}
.send{display:flex;gap:8px}
.send input{flex:1;min-width:0;min-height:48px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.send button{width:48px;height:48px;border:0;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* accueil position */
#gate{position:absolute;inset:0;z-index:2000;background:var(--green);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:28px}
#gate[hidden]{display:none}
#gate .field input{border:0}
#toast{position:absolute;z-index:3000;left:16px;right:16px;bottom:84px;padding:12px 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <section class="tab on" id="tab-map">
    <div id="map"></div>
    <div class="maptop">
      <button class="searchbtn" data-act="assistant"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.800L12 17l-1.800-5.200L5 10l5.200-1.800zM19 16v4M17 18h4"/></svg><span>Demandez à l'assistant : « où faire de la boxe ? »</span></button>
      <div class="chips" id="groupchips"></div>
    </div>
    <button class="locate" id="locate" data-act="recenter" aria-label="Recentrer sur ma position" style="bottom:calc(52% + 12px)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <div id="sheet"></div>
  </section>
  <section class="tab" id="tab-routes">
    <div id="map2"></div>
    <div class="maptop"><div class="seg" id="routeseg" style="box-shadow:0 2px 10px rgba(18,32,26,.18)"></div></div>
    <div id="routepanel"></div>
  </section>
  <section class="tab" id="tab-sessions"></section>
  <section class="tab" id="tab-social"></section>
  <section class="tab" id="tab-profile"></section>
  <nav id="tabbar" aria-label="Navigation principale"></nav>
  <div id="page"></div>
  <div id="gate" hidden></div>
  <div id="toast" role="status"></div>
</div>

<script>
'use strict';
/* =====================================================================
   Sport local — prototype web fonctionnel
   Position GPS réelle · carte et lieux OpenStreetMap · itinéraires piétons
   Profil, amis, messages et sessions : enregistrés sur cet appareil
   (mode local) en attendant la connexion à Supabase.
   ===================================================================== */

// ---------- utilitaires ----------
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const ICON = {
  map: 'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
  route: 'M4 18a2 2 0 104 0 2 2 0 10-4 0M16 6a2 2 0 104 0 2 2 0 10-4 0M8 18h7a3 3 0 000-6H9a3 3 0 010-6h7',
  cal: 'M4 7h16v13H4zM4 11h16M8 4v4M16 4v4',
  chat: 'M4 5h16v11H9l-5 4z',
  user: 'M8 8a4 4 0 108 0 4 4 0 10-8 0M4 20c1.500-4 5-5 8-5s6.500 1 8 5',
  back: 'M15 5l-7 7 7 7', next: 'M9 5l7 7-7 7', send: 'M12 19V5M5 12l7-7 7 7'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
const fmtDist = m => m == null ? '' : (m < 1000 ? Math.round(m / 10) * 10 + ' m' : (Math.round(m / 100) / 10).toString().replace('.', ',') + ' km');
const fmtKm = m => (Math.round(m / 100) / 10).toString().replace('.', ',');
const initials = n => String(n || '?').split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function destPoint(p, dist, bearingDeg) {
  const R = 6371000, r = Math.PI / 180, br = bearingDeg * r, la = p.lat * r, lo = p.lon * r, d = dist / R;
  const la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(br));
  const lo2 = lo + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2));
  return { lat: la2 / r, lon: lo2 / r };
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

// ---------- données enregistrées sur l'appareil ----------
const KEY = 'sportlocal.v1';
const LEVELS = ['Débutant', 'Intermédiaire', 'Confirmé', 'Expert'];
const DAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const SLOTS = ['–', 'matin', 'soir', 'journée'];
const SPORTS = ['Football', 'Basket', 'Tennis', 'Padel', 'Rugby', 'Handball', 'Volley', 'Badminton', 'Course à pied', 'Athlétisme', 'Natation', 'Vélo', 'Musculation', 'Street workout', 'Boxe', 'Arts martiaux', 'Escalade', 'Yoga', 'Danse', 'Skate', 'Golf', 'Équitation'];
const DEFAULTS = {
  profile: { name: '', city: '', bio: '', sports: [], dispo: [0, 0, 0, 0, 0, 0, 0] },
  favs: {}, sessions: [], friends: {}, convs: {}, routes: [],
  settings: { radius: 2000, apiKey: '', geoOk: false, manual: null }
};
let db;
try { db = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { db = JSON.parse(JSON.stringify(DEFAULTS)); }
db.settings = Object.assign({}, DEFAULTS.settings, db.settings);
db.profile = Object.assign({}, DEFAULTS.profile, db.profile);
let storageOk = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { if (storageOk) toast('Enregistrement impossible sur ce navigateur'); storageOk = false; } }

// Profils de démonstration : remplacés par les vrais membres avec Supabase.
const DEMO = [
  ['sami', 'Sami K.', [['Tennis', 1], ['Padel', 1]], 'En semaine après 17 h'],
  ['lea', 'Léa M.', [['Street workout', 2], ['Course à pied', 0]], 'Le soir et le week-end'],
  ['nora', 'Nora B.', [['Course à pied', 2], ['Natation', 1]], 'Tôt le matin'],
  ['yanis', 'Yanis D.', [['Boxe', 1], ['Musculation', 1]], 'Le week-end'],
  ['ines', 'Inès T.', [['Tennis', 0], ['Yoga', 2]], 'Mercredi et samedi'],
  ['tom', 'Tom L.', [['Football', 2], ['Course à pied', 1]], 'Le soir'],
  ['eva', 'Eva P.', [['Football', 2], ['Basket', 1]], 'Le soir'],
  ['hugo', 'Hugo R.', [['Escalade', 2], ['Vélo', 1]], 'Le week-end'],
  ['lina', 'Lina A.', [['Natation', 2], ['Vélo', 0]], 'Entre midi et deux'],
  ['malik', 'Malik S.', [['Basket', 2], ['Musculation', 2]], 'Le soir'],
  ['chloe', 'Chloé V.', [['Rugby', 1], ['Musculation', 0]], 'Mardi et jeudi soir'],
  ['adam', 'Adam F.', [['Boxe', 0], ['Course à pied', 1]], 'Le matin']
].map(a => ({ id: a[0], name: a[1], sports: a[2].map(s => ({ name: s[0], level: s[1] })), dispo: a[3] }));
const demoById = id => DEMO.find(p => p.id === id);

// ---------- état en mémoire ----------
const S = {
  tab: 'map', pos: null, posSource: '', acc: null, city: '', country: '',
  places: [], fetchedAt: null, loading: false, loadError: '',
  group: 'all', sheetOpen: true, stack: [],
  chat: [], aiBusy: false, aiHistory: [],
  social: 'messages', search: '',
  routeMode: 'gen', routeKm: 5, routeBearing: Math.random() * 360, route: null, drawPts: [], routeBusy: false, routeNote: ''
};

// =====================================================================
// 1. POSITION
// =====================================================================
function showGate(msg) {
  const g = $('#gate');
  g.hidden = false;
  g.innerHTML = `
    <div class="avatar big">${ico('map')}</div>
    <h1 style="font-size:30px">Sport local a besoin de votre position</h1>
    <div>Elle sert à afficher la carte, les lieux de sport, les parcours et les réponses de l'assistant autour de l'endroit où vous êtes. Elle reste sur cet appareil.</div>
    ${msg ? `<div class="banner">${esc(msg)}</div>` : ''}
    <button class="btn lime" data-act="geo-allow">Autoriser ma position</button>
    <form data-form="geo-city" style="display:flex;flex-direction:column;gap:10px">
      <label class="field">Ou indiquez une ville<input id="gate-city" name="city" type="text" placeholder="Lyon, Marseille, Lille…" autocomplete="off"></label>
      <button class="btn alt" type="submit">Utiliser cette ville</button>
    </form>`;
}
let watchId = null;
function startGeo() {
  if (!navigator.geolocation) { showGate('Ce navigateur ne donne pas accès à la position. Indiquez une ville.'); return; }
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  let first = true;
  watchId = navigator.geolocation.watchPosition(p => {
    db.settings.geoOk = true; db.settings.manual = null; save();
    $('#gate').hidden = true;
    setPosition(p.coords.latitude, p.coords.longitude, 'gps', p.coords.accuracy, first);
    first = false;
  }, err => {
    if (!S.pos) {
      db.settings.geoOk = false; save();
      showGate(err.code === 1 ? 'Autorisation refusée. Autorisez la position dans les réglages du navigateur, ou indiquez une ville.' : 'Position introuvable pour le moment. Réessayez ou indiquez une ville.');
    }
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
async function useCity(name) {
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=fr&q=' + encodeURIComponent(name));
    const j = await r.json();
    if (!j.length) { showGate('Ville introuvable : « ' + name + ' ». Vérifiez l\'orthographe.'); return; }
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    db.settings.manual = { lat: +j[0].lat, lon: +j[0].lon }; save();
    $('#gate').hidden = true;
    setPosition(+j[0].lat, +j[0].lon, 'ville', null, true);
  } catch (e) { showGate('Recherche de la ville impossible. Vérifiez votre connexion.'); }
}
function setPosition(lat, lon, source, acc, recenter) {
  S.pos = { lat, lon }; S.posSource = source; S.acc = acc;
  S.places.forEach(p => { p.dist = haversine(S.pos, p); });
  S.places.sort((a, b) => a.dist - b.dist);
  drawMe();
  if (recenter) { map.setView([lat, lon], 15); if (map2) map2.setView([lat, lon], 14); }
  if (!S.fetchedAt || haversine(S.fetchedAt, S.pos) > 300) { loadPlaces(); reverseCity(); }
  else renderSheet();
}
async function reverseCity() {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=12&accept-language=fr&lat=${S.pos.lat}&lon=${S.pos.lon}`);
    const a = (await r.json()).address || {};
    S.city = a.city || a.town || a.village || a.municipality || a.county || '';
    S.country = (a.country_code || '').toUpperCase();
    renderSheet();
  } catch (e) { /* le nom de la ville est un confort, pas une nécessité */ }
}

// =====================================================================
// 2. LIEUX (OpenStreetMap via Overpass)
// =====================================================================
const GROUPS = [
  ['all', 'Tout', '#12201A'], ['terrain', 'Terrains', '#1B7F4C'], ['salle', 'Salles', '#0E4B38'], ['course', 'Course', '#B45309'],
  ['eau', 'Piscines', '#1F6FEB'], ['plein', 'Plein air', '#6D28D9'], ['shop', 'Magasins', '#BE185D'], ['club', 'Clubs', '#374151'], ['service', 'Services', '#0F766E']
];
const groupColor = g => (GROUPS.find(x => x[0] === g) || GROUPS[0])[2];

      method: 'POST',

      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px">${DAYS.map((d, i) => `<div style="padding:8px 0;border-radius:12px;text-align:center;font-size:13px;font-weight:700;background:${p.dispo[i] ? 'var(--green)' : 'var(--surface)'};color:${p.dispo[i] ? '#fff' : 'var(--muted)'}">${d}<div style="font-size:11px;font-weight:500">${SLOTS[p.dispo[i]]}</div></div>`).join('')}</div>

  };

// =====================================================================
// 9. PARCOURS (itinéraires piétons réels)
// =====================================================================
async function routeThrough(pts) {
  const coords = pts.map(p => p.lon.toFixed(6) + ',' + p.lat.toFixed(6)).join(';');
  try {
    const r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    const j = await r.json();
    if (j.code !== 'Ok') throw new Error(j.code);
    return { line: j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), dist: j.routes[0].distance, approx: false };
  } catch (e) {
    let d = 0; for (let i = 1; i < pts.length; i++) d += haversine(pts[i - 1], pts[i]);
    return { line: pts.map(p => [p.lat, p.lon]), dist: d * 1.25, approx: true };
  }
}
async function generateLoop() {
  if (!S.pos || S.routeBusy) return;
  S.routeBusy = true; S.routeNote = ''; renderRoutes();
  const target = S.routeKm * 1000;
  let radius = target / (2 * Math.PI) * 0.78, best = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    const center = destPoint(S.pos, radius, S.routeBearing);
    const pts = [S.pos, destPoint(center, radius, S.routeBearing + 60), destPoint(center, radius, S.routeBearing - 60), S.pos];
    const r = await routeThrough(pts);
    if (!best || Math.abs(r.dist - target) < Math.abs(best.dist - target)) best = r;
    if (r.approx || Math.abs(r.dist - target) / target < 0.12) break;
    radius *= target / r.dist;
  }
  S.route = best; S.routeBusy = false;
  S.routeNote = best.approx ? 'Service d\'itinéraires indisponible : tracé à vol d\'oiseau, distance estimée.' : '';
  drawRoute(); renderRoutes();
}
async function computeDrawn() {
  drawLayer.clearLayers();
  S.drawPts.forEach((p, i) => L.circleMarker([p.lat, p.lon], { radius: 7, color: '#12201A', weight: 3, fillColor: '#C8F03C', fillOpacity: 1 }).bindTooltip(String(i + 1)).addTo(drawLayer));
  if (S.drawPts.length < 2) { S.route = null; routeLayer.clearLayers(); renderRoutes(); return; }
  S.routeBusy = true; renderRoutes();
  S.route = await routeThrough(S.drawPts); S.routeBusy = false;
  S.routeNote = S.route.approx ? 'Service d\'itinéraires indisponible : tracé en ligne droite.' : '';
  drawRoute(false); renderRoutes();
}
function drawRoute(fit) {
  routeLayer.clearLayers();
  if (!S.route) return;
  L.polyline(S.route.line, { color: '#FFFFFF', weight: 9 }).addTo(routeLayer);
  const l = L.polyline(S.route.line, { color: '#0E4B38', weight: 5 }).addTo(routeLayer);
  if (fit !== false) map2.fitBounds(l.getBounds(), { paddingTopLeft: [30, 90], paddingBottomRight: [30, 260] });
}
function renderRoutes() {
  $('#routeseg').innerHTML = [['gen', 'Générer'], ['draw', 'Tracer'], ['mine', 'Mes parcours']].map(s => `<button class="${S.routeMode === s[0] ? 'on' : ''}" data-act="route-mode" data-id="${s[0]}">${s[1]}</button>`).join('');
  const r = S.route, stats = r ? `<div class="stats"><div><b>${fmtKm(r.dist)} km</b><span class="s">Distance</span></div><div><b>${Math.round(r.dist / 1000 * 6)} min</b><span class="s">À 6 min/km</span></div><div><b>${Math.round(r.dist / 1000 * 62)}</b><span class="s">kcal (estim.)</span></div></div>` : '';
  const saveForm = r ? `<form class="send" data-form="save-route"><input id="rt-name" name="name" type="text" maxlength="60" placeholder="Nom du parcours" aria-label="Nom du parcours" value="${S.routeMode === 'gen' ? 'Boucle de ' + fmtKm(r.dist) + ' km' : 'Mon tracé de ' + fmtKm(r.dist) + ' km'}"><button type="submit" class="btn small" style="width:auto;border-radius:12px;padding:0 14px">Enregistrer</button></form>` : '';
  const note = S.routeNote ? `<div class="banner">${esc(S.routeNote)}</div>` : '';
  let h;
  if (S.routeMode === 'gen') {
    h = `<h2>Boucle depuis ma position</h2><div class="chips">${[3, 5, 8, 10, 15, 21].map(k => `<button class="chip${S.routeKm === k ? ' on' : ''}" data-act="route-km" data-id="${k}">${k} km</button>`).join('')}</div>
      ${S.routeBusy ? '<div class="note">Calcul de l\'itinéraire sur les rues et chemins…</div>' : stats}${note}
      <div class="row"><button class="btn" data-act="route-gen"${S.routeBusy ? ' disabled' : ''}>${r ? 'Autre tracé' : 'Générer la boucle'}</button></div>${saveForm}`;
  } else if (S.routeMode === 'draw') {
    h = `<h2>Tracé manuel</h2><div class="note">Touchez la carte pour poser des points : ils sont reliés par les rues et chemins. ${S.drawPts.length} point${S.drawPts.length > 1 ? 's' : ''} posé${S.drawPts.length > 1 ? 's' : ''}.</div>
      ${S.routeBusy ? '<div class="note">Calcul…</div>' : stats}${note}
      <div class="row"><button class="btn alt small" data-act="draw-undo"${S.drawPts.length ? '' : ' disabled'}>Annuler le dernier</button><button class="btn alt small" data-act="draw-clear"${S.drawPts.length ? '' : ' disabled'}>Tout effacer</button></div>${saveForm}`;
  } else {
    h = `<h2>Mes parcours</h2>${db.routes.length ? db.routes.map(x => `<div class="item" style="border:1px solid var(--line)"><button data-act="route-show" data-id="${x.id}" style="flex:1;min-width:0;border:0;background:none;text-align:left;min-height:44px"><div class="t">${esc(x.name)}</div><div class="s">${fmtKm(x.dist)} km · ${Math.round(x.dist / 1000 * 6)} min</div></button><button class="btn small alt" data-act="route-session" data-id="${x.id}">Session</button><button class="btn small alt" data-act="route-del" data-id="${x.id}" aria-label="Supprimer ${esc(x.name)}">✕</button></div>`).join('') : '<div class="note">Aucun parcours enregistré. Générez une boucle ou tracez la vôtre.</div>'}`;
  }
  $('#routepanel').innerHTML = h;
}

// =====================================================================
// 10. NAVIGATION
// =====================================================================
const TABS = [['map', 'Carte', 'map'], ['routes', 'Parcours', 'route'], ['sessions', 'Sessions', 'cal'], ['social', 'Messages', 'chat'], ['profile', 'Profil', 'user']];
function showTab(id) {
  S.tab = id; S.stack = []; renderPage();
  TABS.forEach(t => $('#tab-' + t[0]).classList.toggle('on', t[0] === id));
  $('#tabbar').innerHTML = TABS.map(t => `<button class="${t[0] === id ? 'on' : ''}" data-act="tab" data-id="${t[0]}"${t[0] === id ? ' aria-current="page"' : ''}>${ico(t[2])}${t[1]}</button>`).join('');
  if (id === 'map') { map.invalidateSize(); renderSheet(); }
  if (id === 'routes') { initMap2(); renderRoutes(); if (S.routeMode === 'gen' && !S.route && S.pos) generateLoop(); }
  if (id === 'sessions') renderSessions();
  if (id === 'social') renderSocial();
  if (id === 'profile') renderProfile();
}
const PAGES = { assistant: pageAssistant, place: pagePlace, 'new-session': pageNewSession, session: pageSession, member: pageMember, chat: pageChat, 'edit-profile': pageEditProfile, settings: pageSettings };
function openPage(type, args) { S.stack.push({ type, args: args || {} }); renderPage(); }
function back() { S.stack.pop(); renderPage(); refreshTab(); }
function refreshTab() { if (S.tab === 'sessions') renderSessions(); if (S.tab === 'social') renderSocial(); if (S.tab === 'profile') renderProfile(); if (S.tab === 'map') renderSheet(); }
function renderPage() {
  const el = $('#page'), top = S.stack[S.stack.length - 1];
  if (!top) { el.classList.remove('on'); el.innerHTML = ''; return; }
  const p = PAGES[top.type](top.args);
  el.classList.add('on');
  el.innerHTML = `<div class="pagehead"><button class="back" data-act="back" aria-label="Retour">${ico('back')}</button>${p.titleAct ? `<button ${p.titleAct} style="border:0;background:none;padding:0;min-height:44px;text-align:left"><h2>${esc(p.title)}</h2></button>` : `<h2>${esc(p.title)}</h2>`}</div><div class="pagebody">${p.body}</div>${p.foot ? `<div class="pagefoot">${p.foot}</div>` : ''}`;
  if (p.scrollEnd) { const b = $('.pagebody', el); b.scrollTop = b.scrollHeight; }
}

// ---------- actions ----------
const ACT = {
  tab: id => showTab(id),
  back: () => back(),
  assistant: () => openPage('assistant'),
  recenter: () => { if (S.pos) map.setView([S.pos.lat, S.pos.lon], 16); },
  group: id => { S.group = id; renderChips(); drawPlaces(); renderSheet(); },
  sheet: () => { S.sheetOpen = !S.sheetOpen; renderSheet(); },
  reload: () => loadPlaces(),
  widen: () => { db.settings.radius = db.settings.radius < 5000 ? 5000 : 10000; save(); S.fetchedAt = null; loadPlaces(); },
  place: id => openPage('place', { id }),
  ask: (id, el) => ask(el.dataset.q),
  'widen-ask': async (id, el) => { db.settings.radius = 10000; save(); S.fetchedAt = null; await loadPlaces(); ask(el.dataset.q); },
  fav: id => { const p = placeById(id); if (db.favs[id]) delete db.favs[id]; else db.favs[id] = { name: p.name }; save(); renderPage(); toast(db.favs[id] ? 'Ajouté aux favoris' : 'Retiré des favoris'); },
  'new-session': id => openPage('new-session', { id }),
  session: id => openPage('session', { id }),
  'del-session': id => { db.sessions = db.sessions.filter(s => s.id !== id); save(); toast('Session supprimée'); back(); },
  invite: (id, el) => { const s = db.sessions.find(x => x.id === el.dataset.session); sendMsg(id, `Je t'invite à ma session « ${s.title} », ${fmtWhen(s.when)}, ${s.placeName}.`, { sessionId: s.id }); openPage('chat', { id }); },
  social: id => { S.social = id; renderSocial(); },
  member: id => openPage('member', { id }),
  chat: id => openPage('chat', { id }),
  'add-friend': id => {
    db.friends[id] = 'pending'; save(); renderPage(); toast('Demande d\'ami envoyée');
    setTimeout(() => { if (db.friends[id] === 'pending') { db.friends[id] = 'friend'; save(); toast(demoById(id).name + ' a accepté votre demande'); renderPage(); refreshTab(); } }, 2500);
  },
  unfriend: id => { delete db.friends[id]; save(); renderPage(); toast('Retiré de vos amis'); },
  'edit-profile': () => { S.draft = JSON.parse(JSON.stringify(db.profile)); openPage('edit-profile'); },
  'pf-sport': id => { keepDraft(); const i = S.draft.sports.findIndex(s => s.name === id); if (i >= 0) S.draft.sports.splice(i, 1); else S.draft.sports.push({ name: id, level: 0 }); renderPage(); },
  'pf-level': id => { keepDraft(); S.draft.sports[+id].level = (S.draft.sports[+id].level + 1) % 4; renderPage(); },
  'pf-dispo': id => { keepDraft(); S.draft.dispo[+id] = (S.draft.dispo[+id] + 1) % 4; renderPage(); },
  settings: () => openPage('settings'),
  'geo-allow': () => { startGeo(); if (S.stack.length) toast('Demande de position envoyée au navigateur'); },
  'geo-change': () => showGate(''),
  radius: id => { db.settings.radius = +id; save(); S.fetchedAt = null; loadPlaces(); renderPage(); },
  reset: (id, el) => { if (el.dataset.sure) { try { localStorage.removeItem(KEY); } catch (e) { /* rien à effacer */ } location.reload(); } else { el.dataset.sure = '1'; el.textContent = 'Confirmer l\'effacement'; } },
  'route-mode': id => { S.routeMode = id; S.route = null; S.routeNote = ''; routeLayer.clearLayers(); drawLayer.clearLayers(); S.drawPts = []; renderRoutes(); if (id === 'gen') generateLoop(); },
  'route-km': id => { S.routeKm = +id; generateLoop(); },
  'route-gen': () => { S.routeBearing = Math.random() * 360; generateLoop(); },
  'draw-undo': () => { S.drawPts.pop(); computeDrawn(); },
  'draw-clear': () => { S.drawPts = []; computeDrawn(); },
  'route-show': id => { const x = db.routes.find(r => r.id === id); S.route = { line: x.line, dist: x.dist }; drawRoute(); },
  'route-del': id => { db.routes = db.routes.filter(r => r.id !== id); save(); renderRoutes(); toast('Parcours supprimé'); },
  'route-session': id => { const x = db.routes.find(r => r.id === id); openPage('new-session', { routeName: x.name }); }
};
function keepDraft() { const f = $('[data-form="profile"]'); if (f) { S.draft.name = f.elements.name.value; S.draft.city = f.elements.city.value; S.draft.bio = f.elements.bio.value; } }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset.id, el);
});
const FORMS = {
  'geo-city': f => { const v = f.elements.city.value.trim(); if (v) useCity(v); },
  ask: f => { const v = f.elements.q.value; f.reset(); ask(v); },
  msg: f => { const v = f.elements.msg.value.trim(); if (!v) return; sendMsg(f.dataset.id, v); renderPage(); },
  session: f => {
    const s = { id: 's' + Date.now(), title: f.elements.title.value.trim(), when: f.elements.when.value, level: +f.elements.level.value, max: +f.elements.max.value || 2, placeId: f.dataset.place, placeName: f.dataset.placename };
    if (!s.title || !s.when) return;
    db.sessions.push(s); save(); S.stack.pop(); openPage('session', { id: s.id }); toast('Session enregistrée');
  },
  profile: f => { keepDraft(); if (!S.draft.name.trim()) { toast('Indiquez un nom'); return; } S.draft.name = S.draft.name.trim(); db.profile = S.draft; save(); toast('Profil enregistré'); back(); },
  apikey: f => { db.settings.apiKey = f.elements.key.value.trim(); S.aiHistory = []; save(); toast(db.settings.apiKey ? 'Clé enregistrée : l\'assistant utilise l\'IA' : 'Clé retirée : assistant sans IA'); },
  'save-route': f => { if (!S.route) return; db.routes.push({ id: 'r' + Date.now(), name: f.elements.name.value.trim() || 'Parcours', dist: S.route.dist, line: S.route.line }); save(); toast('Parcours enregistré'); S.routeMode = 'mine'; drawLayer.clearLayers(); S.drawPts = []; renderRoutes(); }
};
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault(); FORMS[f.dataset.form](f);
});
document.addEventListener('input', e => {
  if (e.target.id === 'social-search') { S.search = e.target.value; $('#social-results').innerHTML = searchResults(); }
});

// ---------- démarrage ----------
if (typeof L === 'undefined') {
  $('#app').innerHTML = '<div class="pad"><h1>Connexion requise</h1><div>La carte n\'a pas pu être chargée. Vérifiez votre connexion Internet puis rechargez la page.</div></div>';
} else {
  initMaps(); renderChips(); showTab('map');
  if (db.settings.manual) setPosition(db.settings.manual.lat, db.settings.manual.lon, 'ville', null, true);
  else if (db.settings.geoOk) startGeo();
  else showGate('');
}
</script>
