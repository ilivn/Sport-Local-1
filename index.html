<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sport local</title>
<meta name="description" content="Trouvez où faire du sport près de chez vous, et avec qui : terrains, salles, piscines, pistes, parcours de course et sessions entre sportifs.">
<meta name="theme-color" content="#0E4B38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Sport local">
<meta property="og:description" content="Trouvez où faire du sport près de chez vous, et avec qui.">
<meta property="og:url" content="https://ilivn.github.io/Sport-Local-1/">
<meta property="og:image" content="https://ilivn.github.io/Sport-Local-1/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F3F4EE; --surface:#FFFFFF; --ink:#12201A; --muted:#55625B; --line:#DDE0D6;
  --green:#0E4B38; --lime:#C8F03C; --warn:#9A3412; --link:#0E4B38;
  --outer:#DADDD2; --warnbg:#FFF3D6; --warnfg:#5B3A00; --onlime:#12201A;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18221D; --ink:#E6ECE8; --muted:#A2B0A8; --line:#2C3832;
  --green:#1E7A55; --link:#8EE0B4; --outer:#0A0F0C; --warnbg:#3A2E10; --warnfg:#F5DFA6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18221D; --ink:#E6ECE8; --muted:#A2B0A8; --line:#2C3832;
  --green:#1E7A55; --link:#8EE0B4; --outer:#0A0F0C; --warnbg:#3A2E10; --warnfg:#F5DFA6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1F6FEB;outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px}
a{color:var(--link);font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--link);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(18,32,26,.18)}
.tab{flex:1;min-height:0;overflow-y:auto;display:none;position:relative}
.tab.on{display:block}
.pad{padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px}
#tabbar{display:flex;height:68px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
#tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
#tabbar button.on{color:var(--link);font-weight:700}
#tabbar svg,.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{min-height:50px;padding:0 18px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.btn.lime{background:var(--lime);color:var(--onlime);border:2px solid var(--onlime)}
.btn.small{min-height:44px;padding:0 14px;border-radius:12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.card{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
button.card,a.card{border:0;text-align:left;text-decoration:none;color:var(--ink);font-weight:400;width:100%}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 12px;border:0;border-radius:16px;background:var(--surface);text-align:left}
.item .grow{flex:1;min-width:0}
.t{font-weight:700;overflow-wrap:anywhere}
.s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex-shrink:0;min-height:40px;padding:0 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--lime);border-color:var(--onlime);color:var(--onlime)}
.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600}
.tag.lime{background:var(--lime);color:var(--onlime)}
.tag.open{background:#D7F5E3;color:#0B4A2C}.tag.closed{background:#FBE1DE;color:#7A1C12}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(18,32,26,.35)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar.big{width:72px;height:72px;font-family:var(--display);font-size:26px;background:var(--lime);color:var(--onlime)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.field input,.field textarea,.field select{min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:400;font-size:15px}
.note{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:12px;background:var(--warnbg);color:var(--warnfg);font-size:13px;font-weight:600}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--link)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.hero{width:100%;max-height:240px;object-fit:cover;border-radius:16px;display:block}
.wx{display:flex;gap:10px;align-items:center}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;font-weight:700;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
/* carte */
#tab-map,#tab-routes{overflow:hidden}
#map,#map2{position:absolute;inset:0;z-index:0;background:#E7EADF}
.maptop{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.maptop>*{pointer-events:auto}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:14px;background:var(--surface);color:var(--muted);box-shadow:0 2px 10px rgba(18,32,26,.18);text-align:left}
.searchbtn .ico{color:var(--link);width:20px;height:20px}
.maptop .chip{box-shadow:0 1px 5px rgba(18,32,26,.16)}
.toprow{display:flex;gap:8px}.toprow .searchbtn{flex:1;min-width:0}
.bell{position:relative;flex:none;width:48px;height:48px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(18,32,26,.18);display:flex;align-items:center;justify-content:center}
.bell[hidden]{display:none}.bell .badge{top:4px;left:auto;right:4px}
.stats.big b{font-size:26px}
.notif.unread{border-left:4px solid var(--lime)}.notif .avatar svg{width:20px;height:20px}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:140px}
.bars>div{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars span{display:block;width:100%;min-height:3px;border-radius:6px 6px 2px 2px;background:#E8590C}
.bars em{font-style:normal;min-height:14px;font-size:10px;font-weight:700;color:var(--muted)}
.bars i{font-style:normal;font-size:10px;color:var(--muted);margin-top:4px}
.grid-medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center;opacity:.55}
.medal.on{opacity:1;border-color:var(--lime)}
.medal .disc{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:var(--line);color:var(--muted)}
.medal.on .disc{background:var(--lime);color:#12201A;box-shadow:inset 0 0 0 3px #0E4B38}
.medal b{font-size:13px}.medal .s{font-size:11px}
.medal.sm{padding:6px;min-width:76px}.medal.sm .disc{width:38px;height:38px;font-size:13px}
.medals-row{display:flex;gap:8px;overflow-x:auto}
.trace{display:block;width:100%;max-width:340px;margin:4px auto;background:var(--bg);border-radius:18px;border:1px solid var(--line)}
.locate{position:absolute;z-index:500;right:12px;width:48px;height:48px;border:0;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(18,32,26,.22);display:flex;align-items:center;justify-content:center}
#sheet{position:absolute;z-index:600;left:0;right:0;bottom:0;max-height:52%;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(18,32,26,.14);display:flex;flex-direction:column}
#sheet.closed .sheetlist{display:none}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 16px;border:0;background:none;text-align:left}
.sheetlist{overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.sheetlist .item{border:1px solid var(--line)}
#routepanel{position:absolute;z-index:600;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(18,32,26,.14);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;max-height:60%;overflow-y:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats b{display:block;font-family:var(--display);font-size:22px}
.me-dot{width:20px;height:20px;border-radius:50%;background:#1F6FEB;border:3px solid #fff;box-shadow:0 0 0 8px rgba(31,111,235,.2)}
.leaflet-container{font-family:var(--body)}
.pin{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(18,32,26,.45)}
.cluster{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;border:3px solid var(--lime);box-shadow:0 2px 6px rgba(18,32,26,.35)}
.hours{white-space:pre-line}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#B42318;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* pages empilées */
#page{position:absolute;inset:0;z-index:1000;background:var(--bg);display:none;flex-direction:column}
#page.on{display:flex}
.pagehead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.back{width:44px;height:44px;border:0;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pagebody{flex:1;min-height:0;overflow-y:auto}
.pagefoot{flex-shrink:0;padding:10px 16px 14px;background:var(--surface);border-top:1px solid var(--line)}
/* discussion */
.msgs{padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:86%;padding:11px 14px;border-radius:18px 18px 18px 4px;background:var(--surface);align-self:flex-start;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--green);color:#fff;border-radius:18px 18px 4px 18px}
.bubble .item{margin-top:8px;border:1px solid var(--line)}
.send{display:flex;gap:8px}
.send input{flex:1;min-width:0;min-height:48px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.send button{width:48px;height:48px;border:0;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* accueil position */
#gate{position:absolute;inset:0;z-index:2000;background:rgba(8,20,14,.42);display:flex;align-items:flex-end;justify-content:center;padding:12px}
#gate[hidden]{display:none}
.welcome{background:var(--surface);color:var(--ink);border-radius:24px;padding:22px 20px;width:100%;max-width:460px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;font-weight:700}
.brand svg{width:40px;height:40px;flex-shrink:0}
.perks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.perks li{padding-left:22px;position:relative}
.perks li::before{content:"";position:absolute;left:4px;top:.55em;width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px var(--green)}
#toast{position:absolute;z-index:3000;left:16px;right:16px;bottom:84px;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (min-width:900px){
  #app{max-width:none}
  #sheet{top:0;bottom:0;left:0;right:auto;width:380px;max-height:none;border-radius:0;box-shadow:2px 0 16px rgba(18,32,26,.14)}
  #sheet.closed .sheetlist{display:flex}
  #tab-map .maptop{left:392px;right:12px;max-width:720px}
  #locate{bottom:24px!important}
  #routepanel{left:12px;right:auto;bottom:12px;width:380px;border-radius:22px;max-height:calc(100% - 90px)}
  #tab-routes .maptop{left:404px;max-width:520px}
  #page{left:auto;width:460px;box-shadow:-6px 0 24px rgba(18,32,26,.18)}
  .tab>.pad,#tab-profile>div{max-width:760px;margin-left:auto;margin-right:auto}
  #toast{left:auto;right:24px;width:380px}
  #gate{align-items:center}
}
</style>
</head>
<body>
<div id="app">
  <section class="tab on" id="tab-map">
    <div id="map"></div>
    <div class="maptop">
      <div class="toprow"><button class="searchbtn" data-act="assistant"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.800L12 17l-1.800-5.200L5 10l5.200-1.800zM19 16v4M17 18h4"/></svg><span>Que voulez-vous faire ? Demandez…</span></button><button class="bell" id="bell" data-act="notifs" hidden aria-label="Notifications"></button></div>
      <div class="chips" id="groupchips"></div>
    </div>
    <button class="locate" id="locate" data-act="recenter" aria-label="Recentrer sur ma position" style="bottom:calc(52% + 12px)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <div id="sheet"></div>
  </section>
  <section class="tab" id="tab-routes">
    <div id="map2"></div>
    <div class="maptop"><div class="seg" id="routeseg" style="box-shadow:0 2px 10px rgba(18,32,26,.18)"></div></div>
    <div id="routepanel"></div>
  </section>
  <section class="tab" id="tab-sessions"></section>
  <section class="tab" id="tab-social"></section>
  <section class="tab" id="tab-profile"></section>
  <nav id="tabbar" aria-label="Navigation principale"></nav>
  <div id="page"></div>
  <div id="gate" hidden></div>
  <div id="toast" role="status"></div>
</div>

<script>
'use strict';
/* =====================================================================
   Sport local — prototype web fonctionnel
   Position GPS réelle · carte et lieux OpenStreetMap · itinéraires piétons
   Profil, amis, messages et sessions : enregistrés sur cet appareil
   (mode local) en attendant la connexion à Supabase.
   ===================================================================== */

// ---------- utilitaires ----------
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const ICON = {
  map: 'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
  route: 'M4 18a2 2 0 104 0 2 2 0 10-4 0M16 6a2 2 0 104 0 2 2 0 10-4 0M8 18h7a3 3 0 000-6H9a3 3 0 010-6h7',
  cal: 'M4 7h16v13H4zM4 11h16M8 4v4M16 4v4',
  chat: 'M4 5h16v11H9l-5 4z',
  user: 'M8 8a4 4 0 108 0 4 4 0 10-8 0M4 20c1.500-4 5-5 8-5s6.500 1 8 5',
  back: 'M15 5l-7 7 7 7', next: 'M9 5l7 7-7 7', send: 'M12 19V5M5 12l7-7 7 7'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
const fmtDist = m => m == null ? '' : (m < 1000 ? Math.round(m / 10) * 10 + ' m' : (Math.round(m / 100) / 10).toString().replace('.', ',') + ' km');
const fmtKm = m => (Math.round(m / 100) / 10).toString().replace('.', ',');
const initials = n => String(n || '?').split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function destPoint(p, dist, bearingDeg) {
  const R = 6371000, r = Math.PI / 180, br = bearingDeg * r, la = p.lat * r, lo = p.lon * r, d = dist / R;
  const la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(br));
  const lo2 = lo + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2));
  return { lat: la2 / r, lon: lo2 / r };
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

// ---------- données enregistrées sur l'appareil ----------
const KEY = 'sportlocal.v1';
const LEVELS = ['Débutant', 'Intermédiaire', 'Confirmé', 'Expert'];
const DAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const SLOTS = ['–', 'matin', 'soir', 'journée'];
// Sur l'appareil : réglages et favoris. Le reste (profil, amis, messages,
// sessions, parcours) est enregistré sur le compte, dans Supabase.
const DEFAULTS = {
  favs: {},
  settings: { radius: 2000, apiKey: '', geoOk: false, manual: null }
};
let db;
try { db = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { db = JSON.parse(JSON.stringify(DEFAULTS)); }
db.settings = Object.assign({}, DEFAULTS.settings, db.settings);
let storageOk = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { if (storageOk) toast('Enregistrement impossible sur ce navigateur'); storageOk = false; } }

// ---------- état en mémoire ----------
const S = {
  tab: 'map', pos: null, posSource: '', acc: null, city: '', country: '',
  places: [], fetchedAt: null, loading: false, loadError: '',
  group: 'all', sheetOpen: true, stack: [],

function localAnswer(q) {

  // « terrain de foot », « club de boxe » : le sport précis prime sur le type de lieu.
  const precise = wanted.filter(i => i[2].length);
  const typeOnly = wanted.filter(i => !i[2].length);
  const free = has(['gratuit', 'pas cher', 'sans payer']), lit = has(['eclaire', 'soir', 'nuit', 'tard']);
  const indoor = has(['couvert', 'interieur', 'pluie', 'abri']), outdoor = has(['plein air', 'exterieur', 'dehors']);
  const near = has([/\bpres\b/, 'proche', 'pas loin', 'a cote', 'plus pres']);
  const tags = wanted.map(i => i[0]);
  if (free) tags.push('Gratuit'); if (lit) tags.push('Éclairé'); if (indoor) tags.push('Couvert'); if (outdoor) tags.push('Plein air'); if (near) tags.push('Au plus près');

  let pool = S.places;
  const typeKinds = new Set(typeOnly.flatMap(i => i[3]));
  const ofType = S.places.filter(p => typeKinds.has(p.kind));
  if (precise.length) {
    const sp = new Set(precise.flatMap(i => i[2])), kinds = new Set(precise.flatMap(i => i[3] || []));
    const nameKeys = precise.flatMap(i => i[1].filter(w => typeof w === 'string' && w.length > 3).concat(i[0].includes(' ') ? [] : [norm(i[0])]));
    const bySport = p => p.sportKeys.some(k => sp.has(k)) || kinds.has(p.kind) || (p.group !== 'service' && nameKeys.some(w => norm(p.name).includes(w)));
    pool = S.places.filter(bySport);
    if (typeOnly.length) {
      // « magasin de running », « club de judo » : le type de lieu demandé d'abord.
      const both = ofType.filter(bySport);
      if (both.length) pool = both;
      else if (typeKinds.has('shop') || typeKinds.has('physiotherapist')) pool = ofType;
    }
  } else if (typeOnly.length) {
    pool = ofType;
  } else {
    // aucun mot-clé connu : recherche dans les noms des lieux
    const words = norm(q).split(/[^a-z0-9]+/).filter(w => w.length > 3);
    const byName = pool.filter(p => words.some(w => norm(p.name + ' ' + p.sports.join(' ')).includes(w)));
    if (byName.length) pool = byName; else if (!tags.length) pool = [];
  }
  const strict = pool.filter(p => (!free || p.free === true || (p.free == null && ['pitch', 'fitness_station', 'track'].includes(p.kind) && p.access !== 'customers')) && (!lit || p.lit) && (!indoor || p.indoor) && (!outdoor || !p.indoor));
  const relaxed = !strict.length && pool.length && (free || lit || indoor || outdoor);
  const list = (strict.length ? strict : pool).slice(0, 8);
  const zone = (S.posSource === 'ville' ? 'autour de ' + (S.city || 'la ville choisie') : 'autour de votre position' + (S.city ? ' (' + S.city + ')' : '')) + ', dans un rayon de ' + fmtDist(db.settings.radius);
  let text;
  if (!S.places.length) text = 'Les lieux autour de vous ne sont pas encore chargés. Réessayez dans un instant.';
  else if (!list.length) text = `Je ne trouve rien pour cette demande ${zone}. Élargissez le rayon, ou lancez la recherche sur le web.`;
  else if (relaxed) text = `Aucun lieu ne remplit tous vos critères ${zone}. Voici les plus proches qui correspondent au sport demandé.`;
  else text = `${list.length === 8 ? 'Voici les 8 lieux les plus proches' : 'J\'ai trouvé ' + list.length + ' lieu' + (list.length > 1 ? 'x' : '')} ${zone}.`;
  return {
    text, tags, empty: !list.length,
    results: list.map(p => ({ id: p.id, why: [p.free === true ? 'gratuit' : (p.free === false ? 'payant' : ''), p.lit ? 'éclairé' : '', p.indoor ? 'couvert' : ''].filter(Boolean).join(' · ') }))
  };
}

function onNewMessage(m) {
  const top = S.stack[S.stack.length - 1];
  if (top && top.type === 'chat' && top.args.id === m.conversation_id && Array.isArray(top.args.msgs)) {
    if (!top.args.msgs.some(x => x.id === m.id)) { top.args.msgs.push(m); paintChat(top.args); }
    if (m.sender_id !== S.user.id) markRead(m.conversation_id);
  } else if (m.sender_id !== S.user.id) {
    namesFor([m.sender_id]).then(n => { const who = n[m.sender_id] || 'un membre'; if (document.visibilityState === 'visible') toast('Nouveau message de ' + who); else systemNotify('Message de ' + who, m.content.slice(0, 120), 'c' + m.conversation_id); });
  }
  refreshConvs();
}
function markRead(convId) {

// Charge une donnée pour une page, puis la réaffiche si elle est toujours au premier plan.
function need(args, key, loader) {
  if (key in args) return args[key];
  if (!args['_' + key]) {
    args['_' + key] = true;
    loader().then(v => { args[key] = v; }, e => { args[key] = { error: errMsg(e) }; }).then(() => {
      const top = S.stack[S.stack.length - 1]; if (top && top.args === args) renderPage();
    });
  }
  return undefined;
}
function refreshTopIf(type) {
  const top = S.stack[S.stack.length - 1];
  if (top && top.type === type) { Object.keys(top.args).filter(k => !['id', 'mode', 'placeId', 'routeId'].includes(k)).forEach(k => delete top.args[k]); renderPage(); }
}

}

async function submitAuth(f) {
  const top = S.stack[S.stack.length - 1], m = f.dataset.mode;
  const email = f.elements.email.value.trim(), pass = f.elements.pass ? f.elements.pass.value : '';
  top.args.busy = true; top.args.msg = ''; renderPage();
  try {
    if (m === 'signup') {
      const r = await sb.auth.signUp({ email, password: pass, options: { data: { display_name: f.elements.name.value.trim() }, emailRedirectTo: SITE_URL } });
      if (r.error) throw r.error;
      if (!r.data.session) { top.args.msg = 'Compte créé. Ouvrez le lien de confirmation envoyé à ' + email + ', puis connectez-vous.'; top.args.mode = 'login'; }
      else { S.stack.pop(); renderPage(); toast('Compte créé, bienvenue !'); }
    } else if (m === 'forgot') {
      const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL });
      if (r.error) throw r.error;
      top.args.msg = 'Si un compte existe pour ' + email + ', un e-mail vient de partir. Ouvrez le lien qu\'il contient.';
    } else {
      const r = await sb.auth.signInWithPassword({ email, password: pass });
      if (r.error) throw r.error;
      S.stack.pop(); renderPage(); toast('Connecté');
    }
  } catch (e) { top.args.msg = errMsg(e); }
  top.args.busy = false; if (S.stack.includes(top)) renderPage();
}

async function submitSession(f) {
  const top = S.stack[S.stack.length - 1], a = top.args;

  const at = a.routeStart || (p ? { lat: p.lat, lon: p.lon } : S.pos);

  const row = {

    level: LEVEL_KEYS[+f.elements.level.value], max_participants: +f.elements.max.value,
    description: f.elements.desc.value.trim() || null, location: point(at),
    place_name: a.routeName ? 'Parcours « ' + a.routeName + ' »' : (p ? p.name : null),
    spot_id: p && p.dbId ? p.dbId : null, route_id: a.routeId || null
  };
  const ev = await act(() => q(sb.from('events').insert(row).select('id').single()));

async function loadEvent(id) {
  let ev;
  try {
    const rows = await q(sb.rpc('event_public', { p_id: id }));
    ev = rows && rows[0];
    if (!ev) throw new Error('Cette session n\'existe plus ou a été annulée.');
  } catch (e) {
    if (!S.user || /n'existe plus/.test(e.message)) throw e;
    // Ancienne base (mise-a-jour-2.sql non exécuté) : lecture directe.
    ev = await q(sb.from('events').select('id,title,description,starts_at,level,max_participants,status,organizer_id,place_name,sport_id').eq('id', id).single());
    ev.sport_name = sportName(ev.sport_id);
  }
  let parts = [];
  if (S.user) {
    parts = (await q(sb.from('event_participants').select('user_id').eq('event_id', id))).map(x => x.user_id);
    await namesFor(parts.concat(ev.organizer_id));
    ev.joined = parts.includes(S.user.id);
    ev.participants_count = parts.length;
  }
  return Object.assign(ev, { parts });
}
function pageEvent(a) {
  if (!sb) return { title: 'Session', body: `<div class="pad">${loginCard('')}</div>` };
  const ev = need(a, 'ev', () => loadEvent(a.id));
  if (!ev) return { title: 'Session', body: LOADING };
  if (ev.error) return { title: 'Session', body: failed(ev) };
  const me = S.user ? S.user.id : null;
  const mine = me && ev.organizer_id === me, joined = !!ev.joined, count = ev.participants_count || ev.parts.length;
  const full = count >= ev.max_participants || ev.status === 'complet';
  const friends = (S.friends || []).filter(f => f.friend === 'ami');
  if (joined && !S.friends) loadFriends();
  const soon = new Date(ev.starts_at) - Date.now() < 6.5 * 864e5;
  const wx = ev.lat != null && soon ? need(a, 'wx', () => weather(ev.lat, ev.lng)) : null;
  const wxText = wx && !wx.error ? wxAtText(wx, ev.starts_at) : '';
  let main;
  if (!me) main = loginCard('Créez un compte pour rejoindre cette session.');
  else if (mine) main = `<button class="btn alt" data-act="event-cancel" data-id="${ev.id}">${a.sure ? 'Confirmer l\'annulation' : 'Annuler la session'}</button>`;
  else if (joined) main = `<button class="btn alt" data-act="event-leave" data-id="${ev.id}">Quitter la session</button>`;
  else if (ev.waiting) main = `<div class="note">Vous êtes sur la liste d'attente : vous prendrez automatiquement la première place libérée.</div><button class="btn alt" data-act="waitlist-leave" data-id="${ev.id}">Quitter la liste d'attente</button>`;
  else if (full) main = `<button class="btn" data-act="waitlist-join" data-id="${ev.id}">Session complète : rejoindre la liste d'attente${ev.waitlist_count ? ' (' + ev.waitlist_count + ' en attente)' : ''}</button>`;
  else main = `<button class="btn" data-act="event-join" data-id="${ev.id}">Rejoindre la session</button>`;
  const people = me ? ev.parts.map(uid => `<button class="item" data-act="${uid === me ? 'tab' : 'member'}" data-id="${uid === me ? 'profile' : uid}"><span class="avatar">${initials(S.names[uid])}</span><span class="grow"><div class="t">${esc(S.names[uid] || 'Membre')}${uid === me ? ' (vous)' : ''}</div><div class="s">${uid === ev.organizer_id ? 'Organise la session' : 'Participe'}</div></span>${ico('next')}</button>`).join('')
    : `<div class="note">Organisée par ${esc(ev.organizer_name || 'un membre')}.</div>`;
  return {
    title: 'Session',
    body: `<div class="pad">
      <div><div class="label" style="color:var(--link)">${esc(fmtWhen(ev.starts_at))}</div><h1 style="margin-top:6px">${esc(ev.title)}</h1>
      <div class="s">${esc(ev.sport_name || sportName(ev.sport_id))} · ${LEVELS[levelIndex(ev.level)]} · ${count} / ${ev.max_participants} participants</div></div>
      ${ev.place_name ? `<div class="card"><div class="label">Lieu</div><div class="t">${esc(ev.place_name)}</div>${ev.lat != null ? `<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${ev.lat},${ev.lng}&travelmode=walking">Itinéraire</a>` : ''}</div>` : ''}
      ${wxText ? `<div class="card"><div class="label">Météo prévue à l'heure de la session</div><div class="t">${esc(wxText)}</div></div>` : ''}
      ${ev.description ? `<div class="card"><div class="label">Détails</div><div class="hours">${esc(ev.description)}</div></div>` : ''}
      <h3>Participants</h3>
      ${people}
      ${joined ? `<button class="btn lime" data-act="event-chat" data-id="${ev.id}">Ouvrir la discussion du groupe</button>` : ''}
      ${main}
      <button class="btn alt small" data-act="share-event" data-id="${ev.id}">Partager cette session</button>
      ${joined && friends.length ? '<h3>Inviter un ami</h3>' + friends.filter(f => !ev.parts.includes(f.id)).map(f => `<button class="item" data-act="invite" data-id="${f.id}" data-event="${ev.id}"><span class="avatar">${initials(personName(f))}</span><span class="grow"><div class="t">${esc(personName(f))}</div><div class="s">Envoyer l'invitation par message</div></span>${ico('next')}</button>`).join('') : ''}
    </div>`
  };
}

// 10. PARCOURS (itinéraires piétons réels, enregistrés sur le compte)
// =====================================================================
async function routeThrough(pts) {
  const coords = pts.map(p => p.lon.toFixed(6) + ',' + p.lat.toFixed(6)).join(';');
  try {
    const r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    const j = await r.json();
    if (j.code !== 'Ok') throw new Error(j.code);
    return { line: j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), dist: j.routes[0].distance, approx: false };
  } catch (e) {
    let d = 0; for (let i = 1; i < pts.length; i++) d += haversine(pts[i - 1], pts[i]);
    return { line: pts.map(p => [p.lat, p.lon]), dist: d * 1.25, approx: true };
  }
}
async function generateLoop() {
  if (!S.pos || S.routeBusy) return;
  S.routeBusy = true; S.routeNote = ''; renderRoutes();
  const target = S.routeKm * 1000;
  let radius = target / (2 * Math.PI) * 0.78, best = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    const center = destPoint(S.pos, radius, S.routeBearing);
    const pts = [S.pos, destPoint(center, radius, S.routeBearing + 60), destPoint(center, radius, S.routeBearing - 60), S.pos];
    const r = await routeThrough(pts);
    if (!best || Math.abs(r.dist - target) < Math.abs(best.dist - target)) best = r;
    if (r.approx || Math.abs(r.dist - target) / target < 0.12) break;
    radius *= target / r.dist;
  }
  S.route = best; S.routeBusy = false;
  S.routeNote = best.approx ? 'Service d\'itinéraires indisponible : tracé à vol d\'oiseau, distance estimée.' : '';
  drawRoute(); renderRoutes();
}
async function computeDrawn() {
  drawLayer.clearLayers();
  S.drawPts.forEach((p, i) => L.circleMarker([p.lat, p.lon], { radius: 7, color: '#12201A', weight: 3, fillColor: '#C8F03C', fillOpacity: 1 }).bindTooltip(String(i + 1)).addTo(drawLayer));
  if (S.drawPts.length < 2) { S.route = null; routeLayer.clearLayers(); renderRoutes(); return; }
  S.routeBusy = true; renderRoutes();
  S.route = await routeThrough(S.drawPts); S.routeBusy = false;
  S.routeNote = S.route.approx ? 'Service d\'itinéraires indisponible : tracé en ligne droite.' : '';
  drawRoute(false); renderRoutes();
}
function drawRoute(fit) {
  routeLayer.clearLayers();
  if (!S.route) return;
  L.polyline(S.route.line, { color: '#FFFFFF', weight: 9 }).addTo(routeLayer);

// ---------- ouvert maintenant (horaires OpenStreetMap courants) ----------
const OH_DAYS = { Su: 0, Mo: 1, Tu: 2, We: 3, Th: 4, Fr: 5, Sa: 6 };
const OH_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// Renvoie true (ouvert), false (fermé) ou null (horaires absents ou trop complexes).
function openState(h, now) {
  if (!h) return null;
  now = now || new Date();
  h = h.trim();
  if (/^24\/7$/.test(h)) return true;
  const today = now.getDay(), minutes = now.getHours() * 60 + now.getMinutes(), month = now.getMonth();
  let state = null, parsedAny = false;
  for (let rule of h.split(/\s*;\s*/)) {
    rule = rule.trim();
    if (!rule) continue;
    const mm = rule.match(/^([A-Z][a-z]{2})(?:\s*-\s*([A-Z][a-z]{2}))?\s+(.*)$/);
    if (mm && OH_MONTHS.includes(mm[1]) && (!mm[2] || OH_MONTHS.includes(mm[2]))) {
      const a = OH_MONTHS.indexOf(mm[1]), b = mm[2] ? OH_MONTHS.indexOf(mm[2]) : a;
      const inside = a <= b ? month >= a && month <= b : month >= a || month <= b;
      parsedAny = true;
      if (!inside) continue;
      rule = mm[3];
    }
    const dm = rule.match(/^((?:Mo|Tu|We|Th|Fr|Sa|Su|PH)(?:\s*[-,]\s*(?:Mo|Tu|We|Th|Fr|Sa|Su|PH))*)?\s*(.*)$/);
    if (!dm) return null;
    let days = null;
    if (dm[1]) {
      days = new Set();
      dm[1].split(/\s*,\s*/).forEach(part => {
        const [x, y] = part.split(/\s*-\s*/);
        if (!(x in OH_DAYS)) return;
        if (!y) { days.add(OH_DAYS[x]); return; }
        if (!(y in OH_DAYS)) return;
        for (let d = OH_DAYS[x], n = 0; n < 7; d = (d + 1) % 7, n++) { days.add(d); if (d === OH_DAYS[y]) break; }
      });
      if (!days.size) continue;                       // règle des seuls jours fériés : ignorée
    }
    const rest = dm[2].trim();
    const applies = !days || days.has(today);
    if (/^(off|closed)$/i.test(rest)) { parsedAny = true; if (applies) state = false; continue; }
    if (/^open$/i.test(rest)) { parsedAny = true; if (applies) state = true; continue; }
    const spans = rest.split(/\s*,\s*/).map(s => s.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/));
    if (!rest || spans.some(s => !s)) return null;    // « sunrise-sunset », semaines… : on ne devine pas
    parsedAny = true;
    if (!applies) continue;
    state = spans.some(s => {
      const from = +s[1] * 60 + +s[2], to = +s[3] * 60 + +s[4];
      return to > from ? minutes >= from && minutes < to : minutes >= from || minutes < to;
    });
  }
  if (!parsedAny) return null;
  return state === null ? false : state;
}

// ---------- météo (Open-Meteo, sans clé) ----------
const WX = { 0: 'Ciel dégagé', 1: 'Plutôt dégagé', 2: 'Partiellement nuageux', 3: 'Couvert', 45: 'Brouillard', 48: 'Brouillard givrant', 51: 'Bruine légère', 53: 'Bruine', 55: 'Bruine forte', 56: 'Bruine verglaçante', 57: 'Bruine verglaçante', 61: 'Pluie faible', 63: 'Pluie', 65: 'Forte pluie', 66: 'Pluie verglaçante', 67: 'Pluie verglaçante', 71: 'Neige faible', 73: 'Neige', 75: 'Forte neige', 77: 'Grésil', 80: 'Averses', 81: 'Averses', 82: 'Fortes averses', 85: 'Averses de neige', 86: 'Averses de neige', 95: 'Orage', 96: 'Orage avec grêle', 99: 'Orage avec grêle' };
const wxCache = {};
async function weather(lat, lon) {
  const key = lat.toFixed(2) + ',' + lon.toFixed(2);
  if (wxCache[key] && Date.now() - wxCache[key].at < 15 * 60000) return wxCache[key].data;
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=temperature_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=7&timezone=auto`);
  if (!r.ok) throw new Error('météo indisponible');
  const data = await r.json();
  wxCache[key] = { at: Date.now(), data };
  return data;
}
function wxNowText(w) {
  const c = w && w.current; if (!c) return '';
  return `${Math.round(c.temperature_2m)} °C · ${WX[c.weather_code] || 'Météo inconnue'} · vent ${Math.round(c.wind_speed_10m)} km/h`;
}
function wxAtText(w, iso) {
  const h = w && w.hourly; if (!h) return '';
  const d = new Date(iso), pad = n => String(n).padStart(2, '0');
  const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;
  const i = h.time.indexOf(key);
  if (i < 0) return '';
  return `${Math.round(h.temperature_2m[i])} °C · ${WX[h.weather_code[i]] || ''} · ${h.precipitation_probability[i] ?? 0} % de risque de pluie`;
}

const placeHash = p => 'lieu/' + (p.userSpot ? 'user/' + p.dbId : p.osm) + '@' + p.lat.toFixed(5) + ',' + p.lon.toFixed(5);
async function shareLink(title, text, hash) {
  const url = SITE_URL + '#' + hash;
  try { if (navigator.share) { await navigator.share({ title, text, url }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('Lien copié : collez-le dans un message'); }
  catch (e) { openPage('info', { title: 'Lien à partager', text: url }); }
}
function pageInfo(a) { return { title: a.title, body: `<div class="pad"><div class="card"><div class="hours" style="user-select:all">${esc(a.text)}</div></div></div>` }; }
async function openFromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!h) return;
  history.replaceState(null, '', location.pathname + location.search);
  let m = h.match(/^session\/([0-9a-f-]{36})$/);
  if (m) { openPage('event', { id: m[1] }); return; }
  m = h.match(/^groupe\/([0-9a-f-]{36})$/);
  if (m) { openPage('group', { id: m[1] }); return; }
  m = h.match(/^lieu\/(node|way|relation|user)\/([0-9a-f-]+)@(-?[\d.]+),(-?[\d.]+)$/);
  if (!m) return;
  const lat = +m[3], lon = +m[4];
  map.setView([lat, lon], 17);
  let el = null;
  try {
    if (m[1] === 'user') {
      const row = await q(sb.from('spots').select('id,osm_tags,location').eq('id', m[2]).single());
      el = { type: 'user', id: row.id, lat, lon, tags: row.osm_tags || {}, dbId: row.id };
    } else {
      const j = await fetchOverpass(`[out:json][timeout:25];${m[1]}(${m[2]});out center tags;`);
      el = j && j.elements && j.elements[0];
    }
  } catch (e) { /* lien invalide ou lieu supprimé */ }
  const p = el && parsePlace(el);
  if (!p) { toast('Ce lieu est introuvable.'); return; }
  if (!placeById(p.id)) { p.dist = S.pos ? haversine(S.pos, p) : null; S.places.push(p); }
  openPage('place', { id: p.id });
}

async function shrinkImage(file, max) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('image illisible')), 'image/jpeg', 0.85));
}
const publicUrl = (bucket, path) => sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
function avatarHtml(name, url, big) {

}

    if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }

    <label class="field">Chercher un groupe<input id="group-search" type="search" placeholder="Nom, ville ou sport" value="${esc(S.groupQuery || '')}" autocomplete="off"></label>
    <div id="group-results" style="display:flex;flex-direction:column;gap:10px">${mine.length ? '<h3>Mes groupes</h3>' + mine.map(groupItem).join('') : ''}
    <h3>${S.groupQuery ? 'Résultats' : 'Groupes publics'}</h3>${other.length ? other.map(groupItem).join('') : '<div class="note">' + (S.groupQuery ? 'Aucun groupe ne correspond.' : 'Aucun autre groupe pour l\'instant : créez le premier de votre ville !') + '</div>'}</div>`;
}
let groupT;
document.addEventListener('input', e => { if (e.target.id === 'group-search') { clearTimeout(groupT); S.groupQuery = e.target.value; groupT = setTimeout(() => { S.groups = null; loadGroups().then(() => { const i = $('#group-search'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); }, 350); } });
function pageNewGroup() {
  return {
    title: 'Nouveau groupe',
    body: `<form class="pad" data-form="group">
      <label class="field">Nom du groupe<input name="name" type="text" required minlength="3" maxlength="80" placeholder="Runners du dimanche"></label>
      <label class="field">Sport principal<select name="sport"><option value="">Plusieurs sports</option>${S.sports.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
      <label class="field">Ville<input name="city" type="text" maxlength="80" value="${esc(S.city || (S.me && S.me.city) || '')}"></label>
      <label class="field">Description (facultatif)<textarea name="desc" rows="3" maxlength="1000" placeholder="Niveau, rythme, lieux habituels…"></textarea></label>
      <label class="check"><input type="checkbox" name="pub" checked> Groupe public : tout le monde peut le trouver et le rejoindre</label>
      <div class="note">Un groupe privé n'est visible que de ses membres : vous y ajoutez vos amis vous-même.</div>
      <button class="btn" type="submit">Créer le groupe</button></form>`
  };
}
async function submitGroup(f) {
  const row = { name: f.elements.name.value.trim(), sport_id: f.elements.sport.value ? +f.elements.sport.value : null, city: f.elements.city.value.trim() || null, description: f.elements.desc.value.trim() || null, is_public: f.elements.pub.checked };
  const g = await act(() => q(sb.from('groups').insert(row).select('id').single()));
  if (!g) return;
  toast('Groupe créé'); S.groups = null; S.stats = null; back(); openPage('group', { id: g.id }); refreshConvs();
}
async function loadGroup(id) {
  const [rows, members] = await Promise.all([q(sb.rpc('groups_search', { p_query: '' })), q(sb.rpc('group_members_list', { p_group: id }))]);
  let g = rows.find(x => x.id === id);
  if (!g) { const one = await q(sb.from('groups').select('id,name,description,sport_id,city,is_public,owner_id').eq('id', id).maybeSingle()); if (!one) throw new Error('Ce groupe n\'existe plus ou il est privé.'); g = Object.assign(one, { sport_name: one.sport_id ? sportName(one.sport_id) : null, members_count: members.length, is_member: members.some(m => m.user_id === S.user.id) }); }
  return { g, members };
}
function pageGroup(a) {
  if (!S.user) return { title: 'Groupe', body: `<div class="pad">${loginCard('Connectez-vous pour voir et rejoindre les groupes.')}</div>` };
  const d = need(a, 'd', () => loadGroup(a.id));
  if (!d) return { title: 'Groupe', body: LOADING };
  if (d.error) return { title: 'Groupe', body: failed(d) };
  const { g, members } = d, owner = g.owner_id === S.user.id;
  return {
    title: g.name,
    body: `<div class="pad">
      <div class="label">${esc([g.sport_name || 'Plusieurs sports', g.city, g.is_public ? 'Groupe public' : 'Groupe privé'].filter(Boolean).join(' · '))}</div>
      ${g.description ? `<div>${esc(g.description)}</div>` : ''}
      ${g.is_member ? `<button class="btn" data-act="group-chat" data-id="${g.id}">Ouvrir la discussion du groupe</button>` : `<button class="btn lime" data-act="group-join" data-id="${g.id}">Rejoindre le groupe</button>`}
      <button class="btn alt small" data-act="share-group" data-id="${g.id}">Partager le groupe</button>
      ${owner ? `<button class="btn alt small" data-act="group-add" data-id="${g.id}">Ajouter des amis</button>` : ''}
      <h3>Membres (${members.length})</h3>
      ${members.map(m => `<div class="item">${avatarHtml(m.name, m.avatar_url)}<button class="grow" data-act="member" data-id="${m.user_id}" style="border:0;background:none;text-align:left;min-height:44px"><div class="t">${esc(m.name)}${m.user_id === S.user.id ? ' (vous)' : ''}</div><div class="s">${m.role === 'owner' ? 'Créateur du groupe' : '@' + esc(m.username)}</div></button>${owner && m.role !== 'owner' ? `<button class="btn small alt" data-act="group-kick" data-id="${m.user_id}" aria-label="Retirer ${esc(m.name)} du groupe">Retirer</button>` : ''}</div>`).join('')}
      ${owner ? `<button class="btn alt small" data-act="group-delete" data-id="${g.id}">${a.sure ? 'Confirmer : supprimer le groupe et sa discussion' : 'Supprimer le groupe'}</button>`
        : g.is_member ? `<button class="btn alt small" data-act="group-leave" data-id="${g.id}">Quitter le groupe</button>` : ''}
    </div>`
  };
}
function pageGroupAdd(a) {
  const all = need(a, 'friends', () => q(sb.rpc('my_friends')));
  const d = need(a, 'members', () => q(sb.rpc('group_members_list', { p_group: a.id })));
  if (!all || !d) return { title: 'Ajouter des amis', body: LOADING };
  if (all.error) return { title: 'Ajouter des amis', body: failed(all) };
  const ids = (d.error ? [] : d).map(m => m.user_id), fr = all.filter(f => f.friend === 'ami');
  return {
    title: 'Ajouter des amis',
    body: `<div class="pad">${fr.length ? fr.map(p => `<div class="item">${avatarHtml(personName(p), p.avatar_url)}<span class="grow"><div class="t">${esc(personName(p))}</div><div class="s">${esc(sportsLine(p.sports) || '@' + p.username)}</div></span>${ids.includes(p.id) ? '<span class="tag lime">membre</span>' : `<button class="btn small" data-act="group-add-one" data-id="${p.id}">Ajouter</button>`}</div>`).join('') : '<div class="note">Vous n\'avez pas encore d\'amis à ajouter. Seuls vos amis peuvent être ajoutés à un groupe.</div>'}</div>`
  };
}

// ---------- notifications ----------
S.notifs = null;
function unreadNotifs() { return (S.notifs || []).filter(n => !n.read_at).length; }
async function loadNotifs() {
  if (!S.user) { S.notifs = null; paintBell(); return; }
  const r = await act(() => q(sb.from('notifications').select('id,kind,title,body,link,created_at,read_at').order('created_at', { ascending: false }).limit(60)));
  S.notifs = r || []; paintBell(); refreshTopIf('notifs');
}
function paintBell() {
  const b = $('#bell'); if (!b) return;
  const n = unreadNotifs();
  b.hidden = !S.user;
  b.innerHTML = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1112 0v5l2 2H4zM10 20a2 2 0 004 0"/></svg>${n ? `<span class="badge">${n > 9 ? '9+' : n}</span>` : ''}`;
  b.setAttribute('aria-label', n ? n + ' notification' + (n > 1 ? 's' : '') + ' non lue' + (n > 1 ? 's' : '') : 'Notifications');
  renderTabbar();
}
function systemNotify(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted' || !db.settings.sysNotif || document.visibilityState === 'visible') return;
  try {
    const n = new Notification(title, { body: body || '', tag, icon: 'icon-192.png', badge: 'icon-192.png' });
    n.onclick = () => { window.focus(); n.close(); };
  } catch (e) {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, { body: body || '', tag, icon: 'icon-192.png' })).catch(() => {});
  }
}
function onNotif(n) {
  if (!S.notifs) S.notifs = [];
  if (S.notifs.some(x => x.id === n.id)) return;
  S.notifs.unshift(n); paintBell(); refreshTopIf('notifs');
  if (document.visibilityState === 'visible') toast(n.title); else systemNotify(n.title, n.body, 'n' + n.id);
  if (/^friend/.test(n.kind)) { S.friends = null; S.suggestions = null; }
  if (/^group/.test(n.kind)) { S.groups = null; refreshConvs(); }
  if (/^(event|waitlist)/.test(n.kind)) { S.events = null; refreshConvs(); }
  S.stats = null;
}
const notifIcon = k => /^friend/.test(k) ? 'user' : /^group/.test(k) ? 'chat' : 'cal';
function pageNotifs() {
  if (!S.notifs) { loadNotifs(); return { title: 'Notifications', body: LOADING }; }
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  const ask = perm === 'default' || (perm === 'granted' && !db.settings.sysNotif) ? `<div class="card"><div class="t">Être prévenu même quand l'appli est en arrière-plan</div><div class="s">Demandes d'ami, places libérées, sessions annulées, messages.</div><button class="btn small" data-act="notif-perm" style="margin-top:6px">Activer sur cet appareil</button></div>` : '';
  return {
    title: 'Notifications',
    body: `<div class="pad">${ask}
      ${S.notifs.length ? `<button class="btn alt small" data-act="notif-all"${unreadNotifs() ? '' : ' disabled'}>Tout marquer comme lu</button>` + S.notifs.map(n => `<button class="item notif${n.read_at ? '' : ' unread'}" data-act="notif-open" data-id="${n.id}"><span class="avatar">${ico(notifIcon(n.kind))}</span><span class="grow"><div class="t">${esc(n.title)}</div>${n.body ? `<div class="s">${esc(n.body)}</div>` : ''}<div class="s">${esc(new Date(n.created_at).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}</div></span>${n.link ? ico('next') : ''}</button>`).join('')
        : '<div class="card"><div class="t">Rien de nouveau</div><div class="s">Vous verrez ici les demandes d\'ami, les inscriptions à vos sessions, les places libérées et les groupes.</div></div>'}
    </div>`
  };
}
function openLink(link) {
  const m = String(link || '').match(/^(member|event|group):([0-9a-f-]{36})$/);
  if (!m) return;
  openPage(m[1], { id: m[2] });
}
async function askNotifPermission() {
  if (!('Notification' in window)) { toast('Ce navigateur ne gère pas les notifications. Sur iPhone, installez d\'abord l\'appli sur l\'écran d\'accueil.'); return; }
  const r = await Notification.requestPermission();
  db.settings.sysNotif = r === 'granted'; save();
  toast(r === 'granted' ? 'Notifications activées sur cet appareil' : 'Notifications refusées : vous pourrez les autoriser dans les réglages du navigateur.');
  renderPage();
}

// Rappel des sessions : prévient une fois, 2 h avant (appli ouverte).
function checkReminders() {
  if (!S.user || !S.events) return;
  db.reminded = db.reminded || {};
  const now = Date.now();
  S.events.filter(e => e.joined).forEach(e => {
    const t = new Date(e.starts_at).getTime();
    if (t > now && t - now < 2 * 3600e3 && !db.reminded[e.id]) {
      db.reminded[e.id] = now;
      const msg = 'Rappel : « ' + e.title + ' » à ' + new Date(e.starts_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      if (document.visibilityState === 'visible') toast(msg); else systemNotify(msg, e.place_name || '', 'r' + e.id);
    }
  });
  Object.keys(db.reminded).forEach(id => { if (now - db.reminded[id] > 3 * 864e5) delete db.reminded[id]; });
  save();
}
setInterval(() => { if (S.user && S.pos) loadEvents(true).then(checkReminders); }, 10 * 60e3);

// ---------- pages, actions et formulaires du lot 2 ----------
Object.assign(PAGES, { stats: pageStats, activity: pageActivity, 'new-group': pageNewGroup, group: pageGroup, 'group-add': pageGroupAdd, notifs: pageNotifs });
Object.assign(ACT, {
  'track-sport': id => { S.trackSport = id; renderRoutes(); },
  'track-start': () => startTrack(),
  'track-pause': () => pauseTrack(),
  'track-resume': () => resumeTrack(),
  'track-finish': () => finishTrack(),
  'track-discard': () => { if (!S.trackSure) { S.trackSure = true; renderRoutes(); return; } discardTrack(); },
  'track-go': () => { S.stack = []; renderPage(); S.routeMode = 'track'; showTab('routes'); },
  stats: () => openPage('stats'),
  activity: id => openPage('activity', { id }),
  'activity-map': () => { const x = topArgs().act; if (x && x.path) showActivityOnMap(x); },
  'activity-route': async () => {
    const x = topArgs().act; if (!x || !x.path) return;
    const pts = x.path.length > 800 ? x.path.filter((p, i) => i % Math.ceil(x.path.length / 800) === 0 || i === x.path.length - 1) : x.path;
    const ok = await act(() => q(sb.from('routes').insert({ name: x.title.slice(0, 120).padEnd(2, '.'), city: S.city || null, is_loop: haversine({ lat: pts[0][1], lon: pts[0][0] }, { lat: pts[pts.length - 1][1], lon: pts[pts.length - 1][0] }) < 150, path: 'SRID=4326;LINESTRING(' + pts.map(p => p[0] + ' ' + p[1]).join(', ') + ')' })));
    if (ok !== undefined) { toast('Parcours enregistré dans « Mes parcours »'); S.myRoutes = null; S.stats = null; }
  },
  'activity-vis': async id => { const a = topArgs(); const ok = await act(() => q(sb.from('activities').update({ visibility: id }).eq('id', a.id))); if (ok !== undefined) { a.act.visibility = id; renderPage(); } },
  'activity-del': async () => {
    const a = topArgs(); if (!a.sure) { a.sure = true; renderPage(); return; }
    const ok = await act(() => q(sb.from('activities').delete().eq('id', a.id)));
    if (ok !== undefined) { toast('Activité supprimée'); S.stats = null; back(); refreshTopIf('stats'); }
  },
  'group-new': () => { loadSports().catch(() => {}); openPage('new-group'); },
  'group-open': id => openPage('group', { id }),
  'group-join': async id => { const ok = await act(() => q(sb.from('group_members').insert({ group_id: id }))); if (ok !== undefined) { toast('Bienvenue dans le groupe !'); S.groups = null; S.stats = null; refreshTopIf('group'); refreshConvs(); } },
  'group-leave': async id => { const ok = await act(() => q(sb.from('group_members').delete().eq('group_id', id).eq('user_id', S.user.id))); if (ok !== undefined) { toast('Vous avez quitté le groupe'); S.groups = null; back(); refreshConvs(); } },
  'group-kick': async uid => { const a = topArgs(); const ok = await act(() => q(sb.from('group_members').delete().eq('group_id', a.id).eq('user_id', uid))); if (ok !== undefined) { toast('Membre retiré'); refreshTopIf('group'); } },
  'group-delete': async id => {
    const a = topArgs(); if (!a.sure) { a.sure = true; renderPage(); return; }
    const ok = await act(() => q(sb.from('groups').delete().eq('id', id)));
    if (ok !== undefined) { toast('Groupe supprimé'); S.groups = null; back(); refreshConvs(); }
  },
  'group-add': id => openPage('group-add', { id }),
  'group-add-one': async uid => { const a = topArgs(); const ok = await act(() => q(sb.from('group_members').insert({ group_id: a.id, user_id: uid }))); if (ok !== undefined) { toast('Ami ajouté au groupe'); delete a.members; delete a._members; renderPage(); } },
  'group-chat': async id => {
    let conv = (S.convs.find(c => c.group_id === id) || {}).conversation_id;
    if (!conv) { await refreshConvs(); conv = (S.convs.find(c => c.group_id === id) || {}).conversation_id; }
    if (conv) openPage('chat', { id: conv }); else toast('Discussion introuvable, réessayez dans un instant.');
  },
  'share-group': id => { const g = (topArgs().d || {}).g; shareLink(g ? g.name : 'Groupe', g ? `Rejoins le groupe « ${g.name} » sur Sport local` : 'Groupe sur Sport local', 'groupe/' + id); },
  notifs: () => { if (!S.user) { openPage('auth', { mode: 'login' }); return; } openPage('notifs'); loadNotifs(); },
  'notif-open': async id => {
    const n = (S.notifs || []).find(x => String(x.id) === String(id)); if (!n) return;
    if (!n.read_at) { n.read_at = new Date().toISOString(); paintBell(); sb.from('notifications').update({ read_at: n.read_at }).eq('id', n.id).then(() => {}); }
    if (n.link) openLink(n.link); else renderPage();
  },
  'notif-all': async () => {
    const now = new Date().toISOString();
    const ok = await act(() => q(sb.from('notifications').update({ read_at: now }).is('read_at', null)));
    if (ok !== undefined) { (S.notifs || []).forEach(n => { n.read_at = n.read_at || now; }); paintBell(); renderPage(); }
  },
  'notif-perm': () => askNotifPermission()
});
Object.assign(FORMS, {
  'track-save': f => saveTrack(f),
  group: f => submitGroup(f)
});

function profileStatsHtml() {
  if (!S.stats) { loadStats(); return ''; }
  if (S.stats.error) return '';
  const st = S.stats, got = BADGES.filter(b => b[4](st) >= 1);
  return `<button class="card" data-act="stats" style="text-align:left;width:100%;display:flex;flex-direction:column;gap:8px">
    <div class="label">Mon activité</div>
    <div class="stats"><div><b>${fmtKm(st.week_m)} km</b><span class="s">Cette semaine</span></div><div><b>${st.streak_weeks}</b><span class="s">Semaine${st.streak_weeks > 1 ? 's' : ''} d'affilée</span></div><div><b>${got.length}/${BADGES.length}</b><span class="s">Badges</span></div></div>
    ${got.length ? `<div class="medals-row">${got.slice(-5).reverse().map(b => badgeHtml(b, st, true)).join('')}</div>` : '<div class="s">Enregistrez une activité ou rejoignez une session pour gagner vos premiers badges.</div>'}
    <span class="s" style="font-weight:700;color:var(--link)">Statistiques, badges et activités ›</span></button>`;
}
ACT['notif-off'] = () => { db.settings.sysNotif = false; save(); renderPage(); };

// ---------- démarrage ----------
if (typeof L === 'undefined') {
  $('#app').innerHTML = '<div class="pad"><h1>Connexion requise</h1><div>La carte n\'a pas pu être chargée. Vérifiez votre connexion Internet puis rechargez la page.</div></div>';
} else {
  applyTheme();
  initMaps(); renderChips(); showTab('map');
  if (db.settings.manual) setPosition(db.settings.manual.lat, db.settings.manual.lon, 'ville', null, true);
  else if (db.settings.geoOk) startGeo();
  else showGate('');
  if (sb) {
    // Le rappel de Supabase ne doit pas attendre d'autres appels Supabase : on les décale.
    sb.auth.onAuthStateChange((event, session) => {
      setTimeout(() => {
        setSession(session);
        if (event === 'PASSWORD_RECOVERY') openPage('newpass');
      }, 0);
    });
    loadSports().catch(() => {});
  }
  if (location.hash.length > 1) openFromHash();
  if (S.track && S.track.state !== 'done') toast('Activité en pause retrouvée : ouvrez Parcours > Suivi GPS pour la reprendre.');
  window.addEventListener('hashchange', openFromHash);
}
</script>
</body>
</html>
