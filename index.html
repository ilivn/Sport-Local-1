<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<body>
<div id="app">
  <section class="tab on" id="tab-map">
    <div id="map"></div>
    <div class="maptop">
      <div class="toprow"><button class="searchbtn" data-act="assistant"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.800L12 17l-1.800-5.200L5 10l5.200-1.800zM19 16v4M17 18h4"/></svg><span>Que voulez-vous faire ? Demandez…</span></button><button class="bell" id="bell" data-act="notifs" hidden aria-label="Notifications"></button></div>
      <div class="chips" id="groupchips"></div>
    </div>
    <button class="locate" id="locate" data-act="recenter" aria-label="Recentrer sur ma position" style="bottom:calc(52% + 12px)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <div id="sheet"></div>
  </section>
  <section class="tab" id="tab-routes">
    <div id="map2"></div>
    <div class="maptop"><div class="seg" id="routeseg" style="box-shadow:0 2px 10px rgba(18,32,26,.18)"></div></div>
    <div id="routepanel"></div>
  </section>
  <section class="tab" id="tab-sessions"></section>
  <section class="tab" id="tab-social"></section>
  <section class="tab" id="tab-profile"></section>
  <nav id="tabbar" aria-label="Navigation principale"></nav>
  <div id="page"></div>
  <div id="gate" hidden></div>
  <div id="toast" role="status"></div>
</div>

<script src="js/00-base.js"></script>

<script src="js/14-demarrage.js"></script>
